name: build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tierworks-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.2.1"

      - name: Move to latest branch head
        if: github.event_name == 'push'
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"

      - name: Resolve Tierworks version
        id: version
        if: github.event_name == 'push'
        run: |
          if git show HEAD^:gradle.properties >/dev/null 2>&1; then
            next_version="$(python scripts/bump_version.py)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            next_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Commit version increment
        if: github.event_name == 'push' && steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Build
        run: gradle build
