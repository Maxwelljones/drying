name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tierworks-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.2.1"

      - name: Resolve next Tierworks version
        id: version
        run: |
          next_version="$(python scripts/bump_version.py)"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "Tierworks release version: $next_version"

      # Build before committing the version. A failed release never modifies main.
      - name: Build release
        run: gradle build

      - name: Commit release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: release ${{ steps.version.outputs.version }}"
          git push origin main

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: tierworks-${{ steps.version.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}"             build/libs/*.jar             --target "$(git rev-parse HEAD)"             --title "Tierworks ${{ steps.version.outputs.version }}"             --generate-notes
